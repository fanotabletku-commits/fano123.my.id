<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fano | TKJ</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .card {
            width: 90%;
            max-width: 700px;
            padding: 50px 30px;
            background: rgba(255,255,255,0.08);
            border-radius: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        h1 {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h2 {
            font-weight: normal;
            color: #93c5fd;
            margin-bottom: 25px;
        }

        p {
            line-height: 1.7;
            color: #dbeafe;
        }

        .skills {
            margin-top: 30px;
        }

        .skill {
            display: inline-block;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 20px;
            background: rgba(255,255,255,0.12);
        }

        footer {
            margin-top: 35px;
            font-size: 14px;
            color: #bfdbfe;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>FANO</h1>

        <h2>Student • TKJ • Networking</h2>

        <p>
            Halo! Saya Fano 👋<br>
            Saya sedang belajar Teknik Komputer dan Jaringan,
            Linux, Cisco, MikroTik, Docker, dan berbagai teknologi server.
        </p>

        <div class="skills">
            <span class="skill">Cisco</span>
            <span class="skill">MikroTik</span>
            <span class="skill">Linux</span>
            <span class="skill">Docker</span>
            <span class="skill">Networking</span>
        </div>

        <footer>
            © 2026 Fano • My Personal Website
        </footer>

    </div>

</body>
</html>
